name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Set up the signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/talkandlearn.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/talkandlearn.p12" >> "$GITHUB_ENV"
            echo "Signing with the permanent key."
          else
            echo "::warning::SIGNING_KEYSTORE secret is not set, so this build uses a temporary key and won't install over an older version."
          fi
      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk TalkAndLearn.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SpeechApp-apk
          path: TalkAndLearn.apk
      - name: Publish to the Releases page
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Rory's Talk Trail (latest build)
          body: |
            The main version is the web app: https://zeronolidge.github.io/SpeechApp/
            This APK is the Android version. Built from ${{ github.sha }}.
          files: TalkAndLearn.apk
          make_latest: true

  web:
    name: Web app (PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the emoji font (only the emoji the app uses)
        # If anything here fails, the copy already in the repo is used instead.
        continue-on-error: true
        run: |
          set -x
          python -m pip install --quiet fonttools lxml
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/NotoColorEmoji.ttf" https://raw.githubusercontent.com/google/fonts/main/ofl/notocoloremoji/NotoColorEmoji-Regular.ttf
          ls -la "$RUNNER_TEMP/NotoColorEmoji.ttf"
          python tools/make_emoji_font.py "$RUNNER_TEMP/NotoColorEmoji.ttf" "$RUNNER_TEMP/emoji.ttf"
          cp "$RUNNER_TEMP/emoji.ttf" app/src/wasmJsMain/composeResources/font/noto_color_emoji.ttf
      - name: Build the web app
        run: ./gradlew --no-daemon :app:wasmJsBrowserDistribution
      - name: Add word listening (Vosk in the browser, small English model)
        # Downloaded at build time (never kept in the repo). If it fails, the app simply has no
        # word listening (loudness still works), so this step can't break the build.
        continue-on-error: true
        run: |
          set -x
          out=app/build/dist/wasmJs/productionExecutable/vosk
          mkdir -p "$out"
          cd "$RUNNER_TEMP"
          npm pack --silent vosk-browser@0.0.8
          tar xzf vosk-browser-0.0.8.tgz
          cp package/dist/vosk.js "$GITHUB_WORKSPACE/$out/vosk-0.0.8.js"
          # The model as a .tar.gz (Vosk strips the archive's top folder, whatever its name).
          if ! curl -fsSL --retry 3 -o model.tar.gz https://ccoreilly.github.io/vosk-browser/models/vosk-model-small-en-us-0.15.tar.gz; then
            curl -fsSL --retry 3 -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
            unzip -q model.zip
            tar czf model.tar.gz vosk-model-small-en-us-0.15
          fi
          cp model.tar.gz "$GITHUB_WORKSPACE/$out/model-small-en-us-0.15.tar.gz"
          ls -la "$GITHUB_WORKSPACE/$out"
      - name: Stamp the service worker with this build and the list of files to save offline
        run: |
          cd app/build/dist/wasmJs/productionExecutable
          sed -i "s/BUILD_ID/${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}/" sw.js
          python3 - <<'PY'
          import json, os
          # Word listening (vosk/) isn't saved up front: it's 45 MB, downloaded on first use instead.
          # Rory's voice clips (about 30 MB) aren't either: each is kept once it has played, and all
          # of them only when a grown-up turns on "Save Rory's voice for offline play".
          files = sorted(os.path.relpath(os.path.join(d, f), '.') for d, _, fs in os.walk('.') for f in fs
                         if f != 'sw.js' and not d.startswith('./vosk') and not (d.startswith('./audio') and f.endswith('.mp3')))
          s = open('sw.js').read().replace('PRECACHE_LIST', json.dumps(files))
          open('sw.js', 'w').write(s)
          print(len(files), 'files to save offline')
          PY
      - name: Check the web app starts in a real browser
        # Loads the build in headless Chrome and fails (so nothing broken gets published) if the
        # app never gets past "Loading…". Startup errors are printed here.
        run: |
          (cd app/build/dist/wasmJs/productionExecutable && python -m http.server 8123 >/dev/null 2>&1 &)
          cp tools/smoke_web.mjs "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null
          npm install --silent --no-audit --no-fund puppeteer-core@23
          sleep 1
          node smoke_web.mjs http://localhost:8123/ --shots
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/dist/wasmJs/productionExecutable

  deploy:
    name: Publish to GitHub Pages
    needs: web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
